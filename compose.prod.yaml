services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: banco-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco}
      POSTGRES_USER: ${POSTGRES_USER:-prueba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BancoSeguro2026*}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prueba} -d ${POSTGRES_DB:-banco}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/jonathanc31/prueba-tecnica-banco:${IMAGE_TAG:-latest}
    container_name: banco-api
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-banco}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prueba}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-BancoSeguro2026*}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    mem_limit: 450m
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/jonathanc31/prueba-tecnica-front:${FRONT_IMAGE_TAG:-latest}
    container_name: banco-web
    restart: always
    ports:
      - "80:8080"
    mem_limit: 64m
    depends_on:
      - api

volumes:
  postgres_data:
