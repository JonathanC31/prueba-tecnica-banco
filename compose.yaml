services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: banco-compose-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco}
      POSTGRES_USER: ${POSTGRES_USER:-prueba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pruebapass}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prueba} -d ${POSTGRES_DB:-banco}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: banco-api:local
    container_name: banco-compose-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-banco}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prueba}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-pruebapass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
    mem_limit: 450m
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
