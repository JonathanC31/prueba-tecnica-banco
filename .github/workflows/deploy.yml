name: CD Despliegue a AWS Elastic Beanstalk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jonathanc31/prueba-tecnica-banco
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: prueba-tecnica-banco
  EB_ENVIRONMENT_NAME: banco-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Ejecutar pruebas unitarias y de controladores
        run: ./mvnw -B test

      - name: 4. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Login en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Construir y publicar imagen Docker optimizada
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Preparar paquete de despliegue para Elastic Beanstalk
        run: |
          cp compose.prod.yaml docker-compose.yml
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          zip -r deploy.zip docker-compose.yml .env .ebextensions

      - name: 8. Desplegar en AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: "v-${{ github.run_number }}"
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy.zip
